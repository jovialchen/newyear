<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 · 林间小路</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/",
            "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@3.4.2/lib/three-vrm.module.js"
        }
    }
    </script>
</head>
<body>
    <!-- 加载画面（加载完直接露出 intro） -->
    <div id="loading">
        <p class="loading-title">2026 · 林间小路</p>
        <p id="loading-text">正在走进森林…</p>
    </div>

    <!-- 长博客：往下滑 = 沿小路往前走（JS 会在 #finale 之前注入 spacer + article × 19） -->
    <main id="story">
        <section id="intro">
            <h1 class="start-title">2026 · 林间小路</h1>
            <p class="start-subtitle">往下滑，走过这一年的点点滴滴</p>
            <p class="scroll-hint">↓</p>
        </section>
        <section id="finale">
            <div class="finale-card">
                <h2>2027 新年快乐 ✨</h2>
                <p>谢谢你陪我走完这一年</p>
                <button id="restart-btn" class="big-btn">再走一遍 ↑</button>
            </div>
        </section>
    </main>

    <!-- 顶部进度条 -->
    <div id="progress"><div id="progress-fill"><span id="progress-head">🐾</span></div></div>

    <script type="module" src="walk.js"></script>
</body>
</html>
